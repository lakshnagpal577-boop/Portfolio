<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Laksh Nagpal</title>
  <meta name="description" content="Contact details for Laksh Nagpal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">Laksh Nagpal</a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a class="active" href="/contact" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h1 class="page-title">Contact</h1>

    <div class="contact-layout">
      <section aria-labelledby="details-title">
        <h2 id="details-title">Contact details</h2>
        <address>
          <ul class="contact-list">
            <li>
              <span class="contact-label">Email</span>
              <a href="mailto:lakshnagpal577@gmail.com">lakshnagpal577@gmail.com</a>
            </li>
            <li>
              <span class="contact-label">Phone</span>
              <a href="tel:+917023398492">+91 70233 98492</a>
            </li>
            <li>
              <span class="contact-label">GitHub</span>
              <a href="https://github.com/lakshnagpal577-boop" rel="noopener">lakshnagpal577-boop</a>
            </li>
            <li>
              <span class="contact-label">Location</span>
              <span>Guwahati, India</span>
            </li>
          </ul>
        </address>
      </section>

      <section aria-labelledby="form-title">
        <h2 id="form-title">Send a message</h2>
        <form class="contact-form" action="mailto:lakshnagpal577@gmail.com" method="post" enctype="text/plain">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <button class="button" type="submit">Send message</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Laksh Nagpal</p>
      <p>Guwahati, India</p>
    </div>
  </footer>
</body>
</html>
